services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: career-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_agent
    ports:
      - "5432:5432"
    volumes:
      - career-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: career-agent-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/career_agent
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:8080", "http://127.0.0.1:8080"]'
      LLM_MODEL_PRESET: ${LLM_MODEL_PRESET:-deepseek-v4-pro}
      LLM_ENABLE_REMOTE: ${LLM_ENABLE_REMOTE:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      EMBEDDING_ENABLE_REMOTE: ${EMBEDDING_ENABLE_REMOTE:-false}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.openai.com/v1}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SEED_KNOWLEDGE_ON_START: ${SEED_KNOWLEDGE_ON_START:-true}
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: career-agent-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  career-agent-postgres:
  backend-uploads:
